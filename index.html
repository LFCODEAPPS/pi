<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Inglés IA (Estilo Learna)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between font-sans">

    <!-- Header / Configuración -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🤖</span>
            <div>
                <h1 class="text-base font-bold tracking-wide">Tutor de Inglés - Nivel Principiante</h1>
                <p class="text-xs text-indigo-400" id="temaActualDisplay">Tema seleccionado: ¡Ninguno (Elige abajo)!</p>
            </div>
        </div>
        <!-- Configuración de API Key -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="password" id="apiKeyInput" placeholder="Groq API Key (gsk_...)" 
                class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-sm text-slate-200 outline-none focus:border-indigo-500 w-full sm:w-56">
            <button onclick="guardarApiKey()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                Guardar
            </button>
        </div>
    </header>

    <!-- Selector de Lecciones (Estilo Mapa de Ruta) -->
    <nav class="bg-slate-900/50 border-b border-slate-800 px-4 py-3">
        <div class="max-w-4xl mx-auto flex gap-2 overflow-x-auto pb-1 scrollbar-none">
            <button onclick="seleccionarLeccion('Say Hello', 'Saludos básicos y presentaciones')" 
                class="leccion-btn bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 text-xs px-3 py-2 rounded-xl whitespace-nowrap transition cursor-pointer font-medium">
                👋 Say Hello
            </button>
            <button onclick="seleccionarLeccion('Numbers', 'Números del 1 al 20 y conteo básico')" 
                class="leccion-btn bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 text-xs px-3 py-2 rounded-xl whitespace-nowrap transition cursor-pointer font-medium">
                🔢 Numbers
            </button>
            <button onclick="seleccionarLeccion('How Are You?', 'Preguntar y responder sobre estados de ánimo y salud')" 
                class="leccion-btn bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 text-xs px-3 py-2 rounded-xl whitespace-nowrap transition cursor-pointer font-medium">
                🚩 How Are You?
            </button>
            <button onclick="seleccionarLeccion('Get to Know You', 'Preguntas personales básicas (nombre, edad, país)')" 
                class="leccion-btn bg-slate-800 hover:bg-indigo-600/40 border border-slate-700 text-xs px-3 py-2 rounded-xl whitespace-nowrap transition cursor-pointer font-medium">
                🤝 Get to Know You
            </button>
        </div>
    </nav>

    <!-- Contenedor del Chat -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-bl-none p-4 max-w-[85%] text-sm shadow text-slate-300">
                ¡Hola! Para comenzar, configura tu API Key de Groq arriba y selecciona una lección en la barra superior (ej. <strong>Say Hello</strong>). Te haré preguntas interactivas en inglés, evaluaré tus respuestas y te daré correcciones.
            </div>
        </div>
    </main>

    <!-- Formulario de Entrada -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 shadow-xl">
        <form id="chatForm" onsubmit="enviarMensaje(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Escribe tu respuesta en inglés..." autocomplete="off"
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 outline-none focus:border-indigo-500 text-sm">
            <button type="submit" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition text-sm flex items-center justify-center cursor-pointer shadow-md">
                Enviar
            </button>
        </form>
    </footer>

    <!-- Lógica de JavaScript -->
    <script>
        let historialMensajes = [];
        let leccionActual = "";

        window.onload = () => {
            const savedKey = localStorage.getItem('GROQ_API_KEY');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function guardarApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('GROQ_API_KEY', key);
                alert('¡API Key guardada exitosamente!');
            } else {
                alert('Ingresa una clave válida.');
            }
        }

        // Función para cambiar de lección / nivel
        async function seleccionarLeccion(nombreTema, descripcion) {
            leccionActual = nombreTema;
            document.getElementById('temaActualDisplay').innerText = `Tema activo: ${nombreTema}`;
            
            // Reiniciar historial con instrucciones estrictas de tutor de inglés
            historialMensajes = [
                {
                    role: "system",
                    content: `Eres un tutor de inglés interactivo y amigable, exactamente como la app Learna. El usuario ha seleccionado la lección: "${nombreTema}" (${descripcion}). 
                    Tu deber es:
                    1. Saludar brevemente en inglés relacionado con este tema.
                    2. Hacerle una pregunta sencilla o proponer un ejercicio corto en inglés acorde al nivel principiante de este tema.
                    3. Esperar su respuesta. Cuando el usuario responda, debes evaluar si está bien o mal, explicarle amablemente los errores gramaticales o de vocabulario (si los hay), darle la forma correcta y hacerle una nueva pregunta para continuar la práctica. Mantén un tono motivador.`
                }
            ];

            // Limpiar chat visual y agregar mensaje de inicio de lección
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            
            agregarMensajeAlDom(`Has seleccionado la lección: **${nombreTema}**. Iniciando ejercicio...`, 'assistant');

            // Iniciar la lección pidiéndole a la IA que lance la primera pregunta
            await dispararPrimerMensajeIA();
        }

        async function dispararPrimerMensajeIA() {
            const apiKey = localStorage.getItem('GROQ_API_KEY') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                agregarMensajeAlDom('⚠️ Por favor configura tu API Key arriba para iniciar la lección.', 'assistant');
                return;
            }

            const idCargando = mostrarCargando();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: historialMensajes,
                        temperature: 0.7,
                        max_tokens: 512
                    })
                });

                const data = await response.json();
                removerCargando(idCargando);

                if (data.choices && data.choices.length > 0) {
                    const respuestaIA = data.choices[0].message.content;
                    agregarMensajeAlDom(respuestaIA, 'assistant');
                    historialMensajes.push({ role: "assistant", content: respuestaIA });
                }
            } catch (error) {
                removerCargando(idCargando);
                agregarMensajeAlDom('⚠️ Error al conectar con la IA de Groq.', 'assistant');
            }
        }

        async function enviarMensaje(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const mensajeTexto = inputField.value.trim();
            const apiKey = localStorage.getItem('GROQ_API_KEY') || document.getElementById('apiKeyInput').value.trim();

            if (!mensajeTexto) return;
            if (!leccionActual) {
                alert('Por favor selecciona primero una lección en la parte superior.');
                return;
            }
            if (!apiKey) {
                alert('Configura tu API Key de Groq primero.');
                return;
            }

            agregarMensajeAlDom(mensajeTexto, 'user');
            inputField.value = '';
            historialMensajes.push({ role: "user", content: mensajeTexto });

            const idCargando = mostrarCargando();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: historialMensajes,
                        temperature: 0.7,
                        max_tokens: 512
                    })
                });

                const data = await response.json();
                removerCargando(idCargando);

                if (data.choices && data.choices.length > 0) {
                    const respuestaIA = data.choices[0].message.content;
                    agregarMensajeAlDom(respuestaIA, 'assistant');
                    historialMensajes.push({ role: "assistant", content: respuestaIA });
                } else {
                    agregarMensajeAlDom('⚠️ No se obtuvo respuesta.', 'assistant');
                }

            } catch (error) {
                removerCargando(idCargando);
                agregarMensajeAlDom(`⚠️ Error de red: ${error.message}`, 'assistant');
            }
        }

        function agregarMensajeAlDom(texto, remitente) {
            const chatContainer = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `flex ${remitente === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-[85%] text-sm shadow leading-relaxed ${
                remitente === 'user' 
                    ? 'bg-indigo-600 text-white rounded-br-none' 
                    : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'
            }`;
            bubble.innerText = texto;
            
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function mostrarCargando() {
            const chatContainer = document.getElementById('chatContainer');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start';
            div.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-bl-none p-4 text-sm text-slate-400 italic shadow">Evaluando respuesta...</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removerCargando(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
