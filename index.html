<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA con Groq API</title>
    <!-- Tailwind CSS CDN para estilos rápidos y modernos -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-md">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🤖</span>
            <h1 class="text-lg font-semibold tracking-wide">Tutor IA - Groq Client</h1>
        </div>
        <!-- Configuración de API Key -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="password" id="apiKeyInput" placeholder="Pega tu Groq API Key (gsk_...)" 
                class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-sm text-slate-200 outline-none focus:border-indigo-500 w-full sm:w-64">
            <button onclick="guardarApiKey()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer whitespace-nowrap">
                Guardar
            </button>
        </div>
    </header>

    <!-- Contenedor del Chat -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-bl-none p-4 max-w-[85%] text-sm shadow text-slate-300">
                ¡Hola! Configura tu API Key de Groq en la parte superior para comenzar. Esta interfaz utiliza el modelo <code class="text-indigo-400 bg-slate-950 px-1 py-0.5 rounded">openai/gpt-oss-120b</code> mediante fetch nativo.
            </div>
        </div>
    </main>

    <!-- Formulario de Entrada -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 shadow-xl">
        <form id="chatForm" onsubmit="enviarMensaje(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje o pregunta aquí..." autocomplete="off"
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 outline-none focus:border-indigo-500 text-sm">
            <button type="submit" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition text-sm flex items-center justify-center cursor-pointer shadow-md">
                Enviar
            </button>
        </form>
    </footer>

    <!-- Lógica de JavaScript -->
    <script>
        // Historial de mensajes inicializado con el rol 'system' y 'user' según los requerimientos
        let historialMensajes = [
            { 
                role: "system", 
                content: "Eres un asistente de inteligencia artificial amigable, servicial y experto actuando como tutor de aprendizaje. Responde de forma clara y estructurada." 
            }
        ];

        // Cargar API Key guardada en el localStorage al iniciar la página
        window.onload = () => {
            const savedKey = localStorage.getItem('GROQ_API_KEY');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        // Función para guardar la API Key en el localStorage
        function guardarApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('GROQ_API_KEY', key);
                alert('¡API Key guardada exitosamente en el localStorage!');
            } else {
                alert('Por favor ingresa una clave válida.');
            }
        }

        // Función principal de envío mediante fetch
        async function enviarMensaje(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const mensajeTexto = inputField.value.trim();
            
            // Obtener la API Key (prioriza localStorage, respaldada por el input si no se ha guardado)
            const apiKey = localStorage.getItem('GROQ_API_KEY') || document.getElementById('apiKeyInput').value.trim();

            if (!mensajeTexto) return;
            if (!apiKey) {
                alert('Por favor configura y guarda tu API Key de Groq primero.');
                return;
            }

            // 1. Agregar el mensaje del usuario al DOM y al historial
            agregarMensajeAlDom(mensajeTexto, 'user');
            inputField.value = '';
            historialMensajes.push({ role: "user", content: mensajeTexto });

            // Mostrar estado de carga
            const idCargando = mostrarCargando();

            try {
                // 2. Realizar la petición fetch hacia el endpoint OpenAI-compatible de Groq
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b", // Modelo especificado
                        messages: historialMensajes,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `Error HTTP: ${response.status}`);
                }

                const data = await response.json();
                removerCargando(idCargando);

                // 3. Procesar la respuesta de la API
                if (data.choices && data.choices.length > 0) {
                    const respuestaIA = data.choices[0].message.content;
                    agregarMensajeAlDom(respuestaIA, 'assistant');
                    // Registrar la respuesta en el historial para mantener el contexto conversacional
                    historialMensajes.push({ role: "assistant", content: respuestaIA });
                } else {
                    agregarMensajeAlDom('⚠️ No se recibió una respuesta válida del servidor.', 'assistant');
                }

            } catch (error) {
                removerCargando(idCargando);
                console.error("Error en la petición a Groq:", error);
                agregarMensajeAlDom(`⚠️ Error de conexión: ${error.message}`, 'assistant');
            }
        }

        // Funciones auxiliares para manipular la interfaz visual (DOM)
        function agregarMensajeAlDom(texto, remitente) {
            const chatContainer = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `flex ${remitente === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-[85%] text-sm shadow leading-relaxed ${
                remitente === 'user' 
                    ? 'bg-indigo-600 text-white rounded-br-none' 
                    : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'
            }`;
            bubble.innerText = texto;
            
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function mostrarCargando() {
            const chatContainer = document.getElementById('chatContainer');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start';
            div.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-bl-none p-4 text-sm text-slate-400 italic shadow flex items-center gap-2">
                    <span class="animate-pulse">Pensando...</span>
                </div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removerCargando(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
