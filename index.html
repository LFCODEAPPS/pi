<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA con Groq</title>
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold flex items-center gap-2">🤖 Tutor IA (Groq)</h1>
        <!-- Configuración de API Key -->
        <div class="flex gap-2">
            <input type="password" id="apiKeyInput" placeholder="Pega tu Groq API Key" class="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-sm text-slate-200 outline-none focus:border-indigo-500">
            <button onclick="guardarApiKey()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded text-sm font-medium transition">Guardar</button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-[80%] text-sm shadow">
                ¡Hola! Configura tu API Key de Groq arriba y dime en qué te gustaría practicar hoy (por ejemplo, inglés, gramática, o simular una conversación).
            </div>
        </div>
    </main>

    <!-- Input Form -->
    <footer class="bg-slate-800 p-4 border-t border-slate-700 shadow-lg">
        <form id="chatForm" onsubmit="enviarMensaje(event)" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." autocomplete="off"
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 outline-none focus:border-indigo-500 text-sm">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-medium transition text-sm flex items-center justify-center">Enviar</button>
        </form>
    </footer>

    <!-- Lógica de JavaScript -->
    <script>
        // Historial de mensajes para mantener el contexto de la conversación
        let historialMensajes = [
            { 
                role: "system", 
                content: "Eres un tutor de inteligencia artificial amigable y paciente, experto en ayudar a usuarios a practicar y mejorar su inglés, corregir gramática de forma sutil y mantener conversaciones interactivas." 
            }
        ];

        function guardarApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('GROQ_API_KEY', key);
                alert('¡API Key guardada en el navegador con éxito!');
            } else {
                alert('Por favor ingresa una clave válida.');
            }
        }

        // Cargar la clave guardada al iniciar si existe
        window.onload = () => {
            const savedKey = localStorage.getItem('GROQ_API_KEY');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        async function enviarMensaje(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const mensajeTexto = inputField.value.trim();
            const apiKey = localStorage.getItem('GROQ_API_KEY') || document.getElementById('apiKeyInput').value.trim();

            if (!mensajeTexto) return;
            if (!apiKey) {
                alert('Por favor configura primero tu API Key de Groq.');
                return;
            }

            // Mostrar mensaje del usuario en pantalla
            agregarMensajeAlDom(mensajeTexto, 'user');
            inputField.value = '';
            historialMensajes.push({ role: "user", content: mensajeTexto });

            // Indicador de "escribiendo..."
            const idCargando = mostrarCargando();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile", // Puedes cambiar al modelo de tu preferencia en Groq
                        messages: historialMensajes,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                removerCargando(idCargando);

                if (data.choices && data.choices.length > 0) {
                    const respuestaIA = data.choices[0].message.content;
                    agregarMensajeAlDom(respuestaIA, 'assistant');
                    historialMensajes.push({ role: "assistant", content: respuestaIA });
                } else {
                    agregarMensajeAlDom('⚠️ Error: No se obtuvo respuesta de Groq. Revisa tu API Key.', 'assistant');
                }

            } catch (error) {
                removerCargando(idCargando);
                console.error(error);
                agregarMensajeAlDom('⚠️ Error de red al conectar con la API de Groq.', 'assistant');
            }
        }

        function agregarMensajeAlDom(texto, remitente) {
            const chatContainer = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `flex ${remitente === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-[80%] text-sm shadow ${
                remitente === 'user' 
                    ? 'bg-indigo-600 text-white rounded-br-none' 
                    : 'bg-slate-800 border border-slate-700 text-slate-100 rounded-bl-none'
            }`;
            bubble.innerText = texto;
            
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function mostrarCargando() {
            const chatContainer = document.getElementById('chatContainer');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start';
            div.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-slate-400 italic">Pensando...</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removerCargando(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
